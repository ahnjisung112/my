<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 정리 도구</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#d9dee3; --text:#1f2933; --sub:#5f6b7a; --accent:#1f6feb; --ok:#1a7f37; --warn:#b35c00; --err:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif; font-size:14px; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--sub); font-size:12px; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  label { cursor:pointer; }
  button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { background:#fff; color:var(--err); border-color:var(--err); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .muted { color:var(--sub); font-size:12px; }
  .notice { padding:10px 12px; border-radius:6px; background:#fff7e6; border:1px solid #f0c36d; color:#6b4400; margin-top:10px; }
  .notice.ok { background:#e9f7ee; border-color:#9fd3b0; color:#135c2b; }
  .notice.err { background:#fdecec; border-color:#f0a3a3; color:#7a1414; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#f8fafc; font-weight:600; }
  td.num { text-align:right; white-space:nowrap; }
  td.skip { color:var(--sub); }
  .stats { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .stats span b { font-size:16px; }
  textarea { width:100%; min-height:160px; font:12px/1.5 Consolas,monospace; border:1px solid var(--line); border-radius:6px; padding:8px; }
  #log { white-space:pre-wrap; font:12px/1.5 Consolas,monospace; background:#f8fafc; border:1px solid var(--line); border-radius:6px; padding:8px; max-height:260px; overflow:auto; }
  .hidden { display:none !important; }
  footer { text-align:center; color:var(--sub); font-size:11px; padding:16px; }
</style>
</head>
<body>
<header>
  <h1>파일 정리 도구</h1>
  <p>오프라인 단일 HTML · 설치 없음 · 외부 통신 없음 · 사용자가 고른 폴더 안에서만 동작</p>
</header>
<main>

<section>
  <h2>1. 정리할 폴더 선택</h2>
  <div class="row">
    <button id="btnPick" class="primary">폴더 선택</button>
    <label id="fallbackLabel" class="hidden"><input type="file" id="fallbackInput" webkitdirectory multiple class="hidden"><button type="button" id="btnFallback">폴더 선택 (읽기 전용)</button></label>
    <span id="pickedName" class="muted">아직 선택된 폴더가 없습니다.</span>
  </div>
  <div class="row" style="margin-top:10px">
    <label><input type="checkbox" id="optRecursive"> 하위 폴더 안의 파일도 모아서 정리 (하위 폴더 파일을 최상위 분류 폴더로 이동)</label>
  </div>
  <div id="modeNotice" class="notice hidden"></div>
</section>

<section>
  <h2>2. 정리 규칙</h2>
  <div class="row">
    <span>분류 기준:</span>
    <label><input type="radio" name="rule" value="ext" checked> 종류별 (문서/이미지/영상/음악/압축/도면/기타)</label>
    <label><input type="radio" name="rule" value="month"> 월별 (수정일 기준, 예: 2026-10)</label>
    <label><input type="radio" name="rule" value="ext-month"> 종류별 → 월별</label>
  </div>
  <div class="row" style="margin-top:8px">
    <label><input type="checkbox" id="optDatePrefix"> 파일명 앞에 수정일 붙이기 (예: 20261023_보고서.docx)</label>
  </div>
  <div class="row" style="margin-top:8px">
    <label>제외할 확장자 (쉼표 구분): <input type="text" id="optExclude" placeholder="예: exe, bat, lnk" style="font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;width:220px"></label>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="btnPlan" disabled>미리보기 만들기</button>
    <span class="muted">실제로 옮기기 전에 어디로 가는지 먼저 보여 줍니다.</span>
  </div>
</section>

<section id="planSection" class="hidden">
  <h2>3. 미리보기</h2>
  <div class="stats">
    <span>전체 <b id="stTotal">0</b>개</span>
    <span>이동 예정 <b id="stMove">0</b>개</span>
    <span>이미 정리됨 <b id="stSkip">0</b>개</span>
  </div>
  <div class="row" style="margin-top:8px">
    <label><input type="checkbox" id="chkAll" checked> 전체 선택/해제</label>
  </div>
  <div style="overflow:auto;max-height:420px">
  <table>
    <thead><tr><th></th><th>현재 위치</th><th>파일명</th><th>크기</th><th>수정일</th><th>이동 위치</th></tr></thead>
    <tbody id="planBody"></tbody>
  </table>
  </div>
</section>

<section id="runSection" class="hidden">
  <h2>4. 실행</h2>
  <div class="row">
    <button id="btnRun" class="primary">선택한 파일 지금 정리하기</button>
    <button id="btnUndo" class="danger" disabled>방금 정리한 것 되돌리기</button>
    <span id="progress" class="muted"></span>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="btnBat">배치 파일(.bat) 만들기</button>
    <button id="btnCopyBat" disabled>스크립트 내용 복사</button>
    <button id="btnSaveLog" disabled>작업 기록 저장</button>
    <span class="muted">브라우저에서 직접 옮기지 못하는 환경이면 .bat 스크립트를 폴더 안에 저장한 뒤 실행하세요.</span>
  </div>
  <textarea id="batText" class="hidden" readonly spellcheck="false"></textarea>
  <div id="runNotice" class="notice hidden"></div>
  <div id="log" class="hidden"></div>
</section>

</main>
<footer>파일 정리 도구 · 네트워크 연결이 전혀 필요 없습니다.</footer>

<script>
'use strict';

/* ---------- 분류표 ---------- */
const CATEGORIES = [
  ['문서',   'doc docx docm xls xlsx xlsm ppt pptx pptm pdf hwp hwpx txt csv rtf odt ods odp md html htm xml json'],
  ['이미지', 'jpg jpeg png gif bmp tif tiff webp svg heic'],
  ['영상',   'mp4 avi mkv mov wmv flv webm mpg mpeg'],
  ['음악',   'mp3 wav flac m4a wma ogg aac'],
  ['압축',   'zip rar 7z tar gz egg alz'],
  ['도면',   'dwg dxf'],
].map(([k, v]) => [k, new Set(v.split(' '))]);
const OTHER = '기타';
const SKIP_NAMES = new Set(['thumbs.db', 'desktop.ini']);

function categoryOf(ext) { for (const [k, s] of CATEGORIES) if (s.has(ext)) return k; return OTHER; }
function extOf(name) { const i = name.lastIndexOf('.'); return i > 0 ? name.slice(i + 1).toLowerCase() : ''; }
function isSkippedName(name) {
  const n = name.toLowerCase();
  return SKIP_NAMES.has(n) || n.startsWith('~$') || n.startsWith('.') || /^파일정리.*\.bat$/.test(n) || n === '파일정리.html';
}
function pad2(n) { return String(n).padStart(2, '0'); }
function ymOf(t) { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function ymdOf(t) { const d = new Date(t); return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
function fmtDate(t) { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB'; return (b / 1073741824).toFixed(2) + ' GB'; }
function splitName(name) { const i = name.lastIndexOf('.'); return i > 0 ? [name.slice(0, i), name.slice(i)] : [name, '']; }
function nthName(name, n) { const [b, e] = splitName(name); return n === 0 ? name : `${b} (${n})${e}`; }
function $(id) { return document.getElementById(id); }

/* ---------- 상태 ---------- */
const state = {
  mode: null,          // 'api' | 'fallback'
  root: null,          // FileSystemDirectoryHandle (api)
  rootName: '',
  files: [],           // {name, ext, size, mtime, dir, handle?, parent?}
  plan: [],            // {file, dest, newName, selected, reason}
  lastRun: [],         // {fromDir, fromName, toDir, toName}
  logLines: [],
};
const hasApi = typeof window.showDirectoryPicker === 'function';

/* ---------- UI 보조 ---------- */
function notice(el, msg, kind) {
  el.textContent = msg; el.className = 'notice' + (kind ? ' ' + kind : ''); el.classList.toggle('hidden', !msg);
}
function log(line) {
  state.logLines.push(line);
  const el = $('log'); el.classList.remove('hidden');
  el.textContent = state.logLines.join('\n'); el.scrollTop = el.scrollHeight;
  $('btnSaveLog').disabled = false;
}
function options() {
  return {
    rule: document.querySelector('input[name=rule]:checked').value,
    datePrefix: $('optDatePrefix').checked,
    recursive: $('optRecursive').checked,
    exclude: new Set($('optExclude').value.split(',').map(s => s.trim().toLowerCase().replace(/^\./, '')).filter(Boolean)),
  };
}

/* ---------- 폴더 읽기 ---------- */
async function scanApi(dirHandle, rel, recursive, out) {
  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === 'file') {
      if (isSkippedName(name)) continue;
      let f; try { f = await handle.getFile(); } catch (e) { continue; }
      out.push({ name, ext: extOf(name), size: f.size, mtime: f.lastModified, dir: rel, handle, parent: dirHandle });
    } else if (handle.kind === 'directory' && recursive) {
      await scanApi(handle, rel ? rel + '/' + name : name, recursive, out);
    }
  }
}
function scanFallback(fileList, recursive) {
  const out = []; let rootName = '';
  for (const f of fileList) {
    const parts = (f.webkitRelativePath || f.name).split('/');
    if (!rootName) rootName = parts[0];
    const dir = parts.slice(1, -1).join('/');
    if (!recursive && dir) continue;
    if (isSkippedName(f.name)) continue;
    out.push({ name: f.name, ext: extOf(f.name), size: f.size, mtime: f.lastModified, dir });
  }
  return { out, rootName };
}
async function loadFolder() {
  const o = options();
  const files = [];
  if (state.mode === 'api') await scanApi(state.root, '', o.recursive, files);
  state.files = files;
  state.plan = [];
  $('pickedName').textContent = `선택한 폴더: ${state.rootName} (파일 ${files.length}개)`;
  $('btnPlan').disabled = files.length === 0;
  $('planSection').classList.add('hidden');
}

$('btnPick').addEventListener('click', async () => {
  try {
    const h = await window.showDirectoryPicker({ mode: 'readwrite' });
    state.mode = 'api'; state.root = h; state.rootName = h.name;
    state.lastRun = []; $('btnUndo').disabled = true; $('runSection').classList.add('hidden');
    notice($('modeNotice'), '브라우저가 폴더에 직접 접근합니다. 선택한 폴더 바깥은 건드리지 않습니다.', 'ok');
    await loadFolder();
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    notice($('modeNotice'), `폴더 접근이 거부되었습니다 (${e.name}). 아래 "읽기 전용" 선택으로 목록만 읽고 .bat 스크립트를 만들어 실행하는 방식을 사용하세요.`, 'err');
    $('fallbackLabel').classList.remove('hidden');
  }
});
$('btnFallback').addEventListener('click', () => $('fallbackInput').click());
$('fallbackInput').addEventListener('change', async (ev) => {
  const o = options();
  const { out, rootName } = scanFallback(ev.target.files, o.recursive);
  state.mode = 'fallback'; state.root = null; state.rootName = rootName;
  state.files = out; state.plan = []; state.lastRun = [];
  $('pickedName').textContent = `선택한 폴더: ${rootName} (파일 ${out.length}개, 읽기 전용)`;
  $('btnPlan').disabled = out.length === 0;
  notice($('modeNotice'), '읽기 전용 모드입니다. 미리보기 후 .bat 스크립트를 만들어 폴더 안에 저장하고 실행하면 정리됩니다.', '');
  $('planSection').classList.add('hidden'); $('runSection').classList.add('hidden');
});
$('optRecursive').addEventListener('change', async () => {
  if (state.mode === 'api') await loadFolder();
  else if (state.mode === 'fallback') { state.files = []; $('btnPlan').disabled = true; $('pickedName').textContent = '하위 폴더 옵션이 바뀌었습니다. 폴더를 다시 선택하세요.'; }
});
if (!hasApi) {
  $('btnPick').classList.add('hidden'); $('fallbackLabel').classList.remove('hidden');
  notice($('modeNotice'), '이 브라우저는 폴더 직접 접근을 지원하지 않습니다. 읽기 전용으로 목록을 읽고 .bat 스크립트로 정리합니다.', '');
}

/* ---------- 계획 수립 ---------- */
function buildPlan() {
  const o = options();
  const taken = new Map(); // dir -> Set(lowercased names)
  const take = (dir, name) => { if (!taken.has(dir)) taken.set(dir, new Set()); taken.get(dir).add(name.toLowerCase()); };
  const isTaken = (dir, name) => taken.has(dir) && taken.get(dir).has(name.toLowerCase());
  for (const f of state.files) take(f.dir, f.name);

  const plan = [];
  for (const f of state.files) {
    if (o.exclude.has(f.ext)) { plan.push({ file: f, dest: f.dir, newName: f.name, selected: false, reason: '제외 확장자' }); continue; }
    const parts = [];
    if (o.rule === 'ext' || o.rule === 'ext-month') parts.push(categoryOf(f.ext));
    if (o.rule === 'month' || o.rule === 'ext-month') parts.push(ymOf(f.mtime));
    const dest = parts.join('/');
    let newName = f.name;
    if (o.datePrefix && !/^\d{8}_/.test(f.name)) newName = ymdOf(f.mtime) + '_' + f.name;
    if (dest === f.dir && newName === f.name) { plan.push({ file: f, dest, newName, selected: false, reason: '이미 정리됨' }); continue; }
    let n = 0, cand = newName;
    while (isTaken(dest, cand)) cand = nthName(newName, ++n);
    take(dest, cand);
    plan.push({ file: f, dest, newName: cand, selected: true, reason: '' });
  }
  state.plan = plan;
  renderPlan();
}
function renderPlan() {
  const body = $('planBody'); body.innerHTML = '';
  let move = 0, skip = 0;
  state.plan.forEach((p, i) => {
    const tr = document.createElement('tr');
    const fixed = !!p.reason;
    if (fixed) skip++; else if (p.selected) move++;
    tr.innerHTML = `<td><input type="checkbox" data-i="${i}" ${p.selected ? 'checked' : ''} ${fixed ? 'disabled' : ''}></td>`
      + `<td>${esc(p.file.dir || '(최상위)')}</td><td>${esc(p.file.name)}</td>`
      + `<td class="num">${fmtSize(p.file.size)}</td><td class="num">${fmtDate(p.file.mtime)}</td>`
      + (fixed ? `<td class="skip">${esc(p.reason)}</td>` : `<td>${esc(p.dest || '(최상위)')}${p.newName !== p.file.name ? ' / <b>' + esc(p.newName) + '</b>' : ''}</td>`);
    body.appendChild(tr);
  });
  $('stTotal').textContent = state.plan.length; $('stMove').textContent = move; $('stSkip').textContent = skip;
  $('planSection').classList.remove('hidden'); $('runSection').classList.remove('hidden');
  $('btnRun').disabled = state.mode !== 'api' || move === 0;
  $('batText').classList.add('hidden'); $('btnCopyBat').disabled = true;
  notice($('runNotice'), state.mode === 'fallback' ? '읽기 전용 모드에서는 "배치 파일 만들기"로 정리합니다.' : '', '');
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
$('btnPlan').addEventListener('click', buildPlan);
$('planBody').addEventListener('change', (ev) => {
  const cb = ev.target; if (cb.type !== 'checkbox') return;
  state.plan[+cb.dataset.i].selected = cb.checked;
  $('stMove').textContent = state.plan.filter(p => p.selected && !p.reason).length;
  $('btnRun').disabled = state.mode !== 'api' || +$('stMove').textContent === 0;
});
$('chkAll').addEventListener('change', (ev) => {
  for (const p of state.plan) if (!p.reason) p.selected = ev.target.checked;
  renderPlan();
});

/* ---------- 실제 이동 (API 모드) ---------- */
async function getDir(rel, create) {
  let h = state.root;
  for (const p of rel.split('/').filter(Boolean)) h = await h.getDirectoryHandle(p, { create });
  return h;
}
async function freeName(dirHandle, wanted) {
  for (let n = 0; n < 1000; n++) {
    const cand = nthName(wanted, n);
    try { await dirHandle.getFileHandle(cand); } catch (e) { if (e.name === 'NotFoundError') return cand; throw e; }
  }
  throw new Error('빈 이름을 찾지 못했습니다: ' + wanted);
}
async function physMove(srcDir, name, dstDir, wanted) {
  const same = await srcDir.isSameEntry(dstDir);
  const finalName = (same && wanted === name) ? name : await freeName(dstDir, wanted);
  if (same && finalName === name) return name;
  const fh = await srcDir.getFileHandle(name);
  if (typeof fh.move === 'function') {
    try { if (same) await fh.move(finalName); else await fh.move(dstDir, finalName); return finalName; } catch (e) { /* 복사 후 삭제로 대체 */ }
  }
  const file = await fh.getFile();
  const nh = await dstDir.getFileHandle(finalName, { create: true });
  const w = await nh.createWritable();
  try { await w.write(file); await w.close(); }
  catch (e) { try { await w.abort(); } catch (_) {} try { await dstDir.removeEntry(finalName); } catch (_) {} throw e; }
  const check = await (await dstDir.getFileHandle(finalName)).getFile();
  if (check.size !== file.size) { await dstDir.removeEntry(finalName); throw new Error('복사 검증 실패(크기 불일치)'); }
  await srcDir.removeEntry(name);
  return finalName;
}
$('btnRun').addEventListener('click', async () => {
  const items = state.plan.filter(p => p.selected && !p.reason);
  if (!items.length) return;
  if (!confirm(`${items.length}개 파일을 이동합니다. 계속할까요?`)) return;
  $('btnRun').disabled = true; $('btnUndo').disabled = true;
  state.lastRun = [];
  let ok = 0, fail = 0;
  log(`=== 정리 시작 ${new Date().toLocaleString()} · 폴더: ${state.rootName} ===`);
  for (let i = 0; i < items.length; i++) {
    const p = items[i];
    $('progress').textContent = `진행 중 ${i + 1} / ${items.length}`;
    try {
      const dstDir = await getDir(p.dest, true);
      const finalName = await physMove(p.file.parent, p.file.name, dstDir, p.newName);
      state.lastRun.push({ fromDir: p.file.dir, fromName: p.file.name, toDir: p.dest, toName: finalName });
      log(`[이동] ${p.file.dir ? p.file.dir + '/' : ''}${p.file.name}  →  ${p.dest ? p.dest + '/' : ''}${finalName}`);
      ok++;
    } catch (e) {
      log(`[실패] ${p.file.name}: ${e.name || ''} ${e.message || e}`); fail++;
    }
  }
  $('progress').textContent = '';
  log(`=== 완료: 성공 ${ok}개, 실패 ${fail}개 ===`);
  notice($('runNotice'), fail ? `${ok}개 이동, ${fail}개 실패. 아래 기록을 확인하세요.` : `${ok}개 파일을 정리했습니다.`, fail ? 'err' : 'ok');
  $('btnUndo').disabled = state.lastRun.length === 0;
  await loadFolder();
  $('pickedName').textContent += ' · 정리 완료';
});
$('btnUndo').addEventListener('click', async () => {
  const run = state.lastRun.slice().reverse();
  if (!run.length) return;
  if (!confirm(`방금 이동한 ${run.length}개 파일을 원래 자리로 되돌립니다. 계속할까요?`)) return;
  $('btnUndo').disabled = true;
  let ok = 0, fail = 0;
  log(`=== 되돌리기 시작 ===`);
  for (let i = 0; i < run.length; i++) {
    const r = run[i];
    $('progress').textContent = `되돌리는 중 ${i + 1} / ${run.length}`;
    try {
      const src = await getDir(r.toDir, false);
      const dst = await getDir(r.fromDir, true);
      const name = await physMove(src, r.toName, dst, r.fromName);
      log(`[복구] ${r.toDir ? r.toDir + '/' : ''}${r.toName}  →  ${r.fromDir ? r.fromDir + '/' : ''}${name}`); ok++;
    } catch (e) { log(`[실패] ${r.toName}: ${e.name || ''} ${e.message || e}`); fail++; }
  }
  $('progress').textContent = '';
  log(`=== 되돌리기 완료: 성공 ${ok}개, 실패 ${fail}개 (빈 분류 폴더는 남아 있습니다) ===`);
  notice($('runNotice'), fail ? `${ok}개 복구, ${fail}개 실패.` : `${ok}개 파일을 원래 자리로 되돌렸습니다.`, fail ? 'err' : 'ok');
  state.lastRun = [];
  await loadFolder();
});

/* ---------- 배치 파일 생성 ---------- */
function winPath(dir, name) { return (dir ? dir.replace(/\//g, '\\') + '\\' : '') + name; }
function batEsc(s) { return s.replace(/%/g, '%%'); }
function batEcho(s) { return s.replace(/%/g, '%%').replace(/[\^&|<>()]/g, c => '^' + c); }
function buildBat() {
  const items = state.plan.filter(p => p.selected && !p.reason);
  const dirs = [...new Set(items.map(p => p.dest).filter(Boolean))].sort();
  const L = [];
  L.push('@echo off', 'chcp 65001 >nul', 'setlocal', 'cd /d "%~dp0"', '');
  L.push(`echo 파일 정리 시작: ${items.length}개 (폴더: %cd%)`, 'echo.');
  for (const d of dirs) {
    const parts = d.split('/'); let acc = '';
    for (const p of parts) { acc = acc ? acc + '\\' + p : p; L.push(`if not exist "${batEsc(acc)}" mkdir "${batEsc(acc)}"`); }
  }
  L.push('');
  for (const p of items) {
    const src = batEsc(winPath(p.file.dir, p.file.name)), dst = batEsc(winPath(p.dest, p.newName));
    const es = batEcho(winPath(p.file.dir, p.file.name)), ed = batEcho(winPath(p.dest, p.newName));
    L.push(`if exist "${dst}" (echo [건너뜀] 이미 있음: ${ed}) else (move "${src}" "${dst}" >nul && echo [이동] ${es} -^> ${ed} || echo [실패] ${es})`);
  }
  L.push('', 'echo.', 'echo 완료. 아무 키나 누르면 창이 닫힙니다.', 'pause >nul');
  return L.join('\r\n') + '\r\n';
}
$('btnBat').addEventListener('click', () => {
  const items = state.plan.filter(p => p.selected && !p.reason);
  if (!items.length) { notice($('runNotice'), '이동할 파일이 없습니다. 먼저 미리보기를 만들고 파일을 선택하세요.', 'err'); return; }
  const text = buildBat();
  const ta = $('batText'); ta.value = text; ta.classList.remove('hidden'); $('btnCopyBat').disabled = false;
  const d = new Date();
  const fname = `파일정리_${ymdOf(d)}_${pad2(d.getHours())}${pad2(d.getMinutes())}.bat`;
  download(fname, text);
  notice($('runNotice'), `"${fname}" 을(를) 내려받았습니다. 이 파일을 "${state.rootName}" 폴더 안에 넣고 두 번 클릭하면 정리됩니다. 내려받기가 막혀 있으면 "스크립트 내용 복사"로 메모장에 붙여넣고 같은 이름(.bat)으로 저장하세요.`, 'ok');
});
$('btnCopyBat').addEventListener('click', async () => {
  const ta = $('batText'); ta.select();
  try { await navigator.clipboard.writeText(ta.value); notice($('runNotice'), '복사했습니다. 메모장에 붙여넣고 "파일정리.bat"로 저장(인코딩: UTF-8)한 뒤 정리할 폴더 안에서 실행하세요.', 'ok'); }
  catch (e) { document.execCommand('copy'); }
});
$('btnSaveLog').addEventListener('click', () => {
  const d = new Date();
  download(`파일정리_기록_${ymdOf(d)}_${pad2(d.getHours())}${pad2(d.getMinutes())}.txt`, state.logLines.join('\r\n') + '\r\n');
});
function download(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
</script>
