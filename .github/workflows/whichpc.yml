name: WhichPC

on:
  push:
    paths:
      - "WhichPC/**"
      - ".github/workflows/whichpc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nsis python3-pil
      - name: Build exe + installer
        run: WhichPC/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WhichPC-Setup
          path: WhichPC/dist/*.exe

  windows-smoke-test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WhichPC-Setup
          path: setup
      - name: Install, run, inspect, uninstall
        shell: pwsh
        env:
          WHICHPC_LOG: ${{ runner.temp }}\whichpc.log  # inherited by WhichPC through the installer
        run: |
          $ErrorActionPreference = 'Stop'
          # Start-Process -Wait would also wait for children (the installer starts WhichPC.exe,
          # which keeps running), so wait on the process itself only.
          function RunWait($file, [string[]]$arguments) {
            $p = Start-Process $file -ArgumentList $arguments -PassThru
            $null = $p.Handle  # keeps ExitCode readable after exit
            if (-not $p.WaitForExit(120000)) { throw "$file $arguments did not finish" }
            return $p
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name, $x = 0, $y = 0, $w = 0, $h = 0) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            if ($w -eq 0) { $x = $b.X; $y = $b.Y; $w = $b.Width; $h = $b.Height }
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          Add-Type -TypeDefinition @'
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class Win {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] static extern IntPtr GetWindow(IntPtr h, uint cmd);
            [DllImport("user32.dll", EntryPoint = "GetWindowLongPtrW")] static extern IntPtr GetWindowLongPtr(IntPtr h, int i);
            [DllImport("user32.dll")] static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            public static void Click(int x, int y) {  // a real left click, like a user's
              SetCursorPos(x, y); mouse_event(2, 0, 0, 0, UIntPtr.Zero); mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }
            // Visible top-level windows of a process; flags the ones the taskbar would show a button for.
            public static List<string> Visible(uint pid) {
              var list = new List<string>();
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) {
                  var c = new StringBuilder(256); GetClassName(h, c, 256);
                  var t = new StringBuilder(256); GetWindowText(h, t, 256);
                  long ex = GetWindowLongPtr(h, -20).ToInt64();
                  bool owned = GetWindow(h, 4) != IntPtr.Zero;
                  bool button = (ex & 0x40000) != 0 || ((ex & 0x80) == 0 && (ex & 0x08000000) == 0 && !owned);
                  list.Add(string.Format("{0} '{1}' exstyle=0x{2:X} taskbarButton={3}", c, t, ex, button));
                }
                return true;
              }, IntPtr.Zero);
              return list;
            }
          }
          '@
          # Counts "device colour" pixels (orange desktop card) in a screen rectangle.
          function OrangePixels($x, $y, $w, $h) {
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, $bmp.Size)
            $n = 0
            for ($yy = 0; $yy -lt $h; $yy += 4) { for ($xx = 0; $xx -lt $w; $xx += 4) {
              $c = $bmp.GetPixel($xx, $yy); if ($c.R -gt 190 -and $c.G -gt 60 -and $c.G -lt 140 -and $c.B -lt 80) { $n++ } } }
            $g.Dispose(); $bmp.Dispose()
            return $n
          }

          $report = [System.Collections.Generic.List[string]]::new()
          function Log([string]$line) { Write-Output $line; $report.Add($line); Add-Content report.txt $line -Encoding utf8 }
          function DumpAppLog() {
            if (Test-Path $env:WHICHPC_LOG) { Log 'WhichPC debug log:'; Get-Content $env:WHICHPC_LOG | ForEach-Object { Log "  $_" } }
          }

          $os = Get-CimInstance Win32_OperatingSystem
          Log "OS: $($os.Caption) build $($os.BuildNumber)"
          Log "Explorer running: $([bool](Get-Process explorer -ErrorAction SilentlyContinue))"
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          Log "Screen: $($screen.Bounds)  work area: $($screen.WorkingArea)"

          $setup = (Get-ChildItem setup\*.exe | Select-Object -First 1).FullName
          $null = RunWait $setup '/S', '/TYPE=desktop', '/OVERLAY=1'
          $exe = "$env:LOCALAPPDATA\Programs\WhichPC\WhichPC.exe"
          if (-not (Test-Path $exe)) { throw 'WhichPC.exe was not installed' }
          Log "Installed: $exe"

          $detect = RunWait $exe '--detect'
          Log "--detect exit code: $($detect.ExitCode)  (1 + device + 10 * reason)"

          Start-Sleep -Seconds 8
          if (-not (Get-Process WhichPC -ErrorAction SilentlyContinue)) { throw 'WhichPC is not running after install' }
          $cfg = Get-ItemProperty HKCU:\Software\WhichPC
          Log "Settings: DeviceType=$($cfg.DeviceType) Overlay=$($cfg.Overlay) TrayAlwaysShow=$($cfg.TrayAlwaysShow)"
          Log "Autostart: $((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).WhichPC)"

          Log "NotifyIconSettings entries for WhichPC (Windows 11 tray promotion):"
          Get-ChildItem 'HKCU:\Control Panel\NotifyIconSettings' -ErrorAction SilentlyContinue | ForEach-Object {
            $v = Get-ItemProperty $_.PSPath
            if ($v.ExecutablePath -like '*WhichPC*') { Log "  $($v.ExecutablePath)  IsPromoted=$($v.IsPromoted)" }
          }

          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $UIA = [System.Windows.Automation.AutomationElement]
          $root = $UIA::RootElement
          function FindTop($property, $value) {
            $c = New-Object System.Windows.Automation.PropertyCondition $property, $value
            return $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $c)
          }
          Log "Taskbar elements naming the device (visible = promoted out of the overflow):"
          $tray = FindTop $UIA::ClassNameProperty 'Shell_TrayWnd'
          if ($tray) {
            $tray.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) |
              Where-Object { $_.Current.Name -match 'WhichPC|데스크탑' } |
              ForEach-Object { Log "  '$($_.Current.Name -replace "`r?`n", ' / ')' at $($_.Current.BoundingRectangle)" }
          } else { Log "  (no Shell_TrayWnd)" }
          function TaskbarNames() {
            if (-not $tray) { return @() }
            return @($tray.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) |
              Where-Object { $_.Current.Name } | ForEach-Object { $_.Current.Name -replace "`r?`n", ' / ' })
          }
          Log "All named taskbar elements: $((TaskbarNames) -join ' | ')"
          $wpid = [uint32](Get-Process WhichPC).Id
          Log "Visible WhichPC windows at startup:"
          foreach ($w in [Win]::Visible($wpid)) { Log "  $w"; if ($w -match 'taskbarButton=True') { DumpAppLog; throw "stray taskbar window: $w" } }

          Shot 'desktop-with-badge'
          $b = $screen.Bounds
          Shot 'crop-taskbar' ($b.Right - 520) ($b.Bottom - 90) 520 90

          Start-Process $exe -ArgumentList '--flash'
          Start-Sleep -Milliseconds 700
          Shot 'identify-card'
          $wa = $screen.WorkingArea
          $cx = $wa.X + [int]($wa.Width / 2); $cy = $wa.Y + [int]($wa.Height / 2) - [int]($wa.Height / 12)
          Shot 'crop-card' ($cx - 330) ($cy - 130) 660 260
          Log "--flash card orange pixels=$(OrangePixels ($cx - 330) ($cy - 130) 660 260)  (positive control)"

          Start-Process $exe -ArgumentList '--settings'
          Start-Sleep -Seconds 3
          Shot 'settings-dialog'
          $dlg = FindTop $UIA::NameProperty 'WhichPC 설정'
          if ($dlg) {
            $r = $dlg.Current.BoundingRectangle
            Log "Settings dialog: $r"
            Shot 'crop-settings' ([int]$r.X) ([int]$r.Y) ([int]$r.Width) ([int]$r.Height)
          } else { Log 'Settings dialog: not found' }

          Log "Visible WhichPC windows with the settings dialog open:"
          foreach ($w in [Win]::Visible($wpid)) { Log "  $w"; if ($w -match 'taskbarButton=True' -and $w -notmatch 'WhichPC 설정') { DumpAppLog; throw "stray taskbar window: $w" } }

          # Big taskbar button mode: clicking the button must show the card and keep the window minimised.
          # Close the settings dialog first, or the taskbar groups both windows into one button.
          try {
            $dlg.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).Close()
            Start-Sleep -Seconds 1
            $before = TaskbarNames
            Set-ItemProperty HKCU:\Software\WhichPC TaskbarButton 1 -Type DWord
            $null = RunWait $exe '--reload'
            Start-Sleep -Seconds 2
            $tbw = [Win]::FindWindow('WhichPC.TaskbarButton', [NullString]::Value)
            Log "Taskbar-button window: $tbw  iconic=$([Win]::IsIconic($tbw))"
            $added = @(TaskbarNames | Where-Object { $before -notcontains $_ })
            Log "  new taskbar elements: $($added -join ' | ')"
            $btn = $tray.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) |
              Where-Object { $added -contains ($_.Current.Name -replace "`r?`n", ' / ') } | Select-Object -First 1
            if ($btn) {
              Start-Sleep -Milliseconds 2600
              Log "  baseline: card orange pixels=$(OrangePixels ($cx - 330) ($cy - 130) 660 260)"
              foreach ($click in 1, 2) {
                Start-Sleep -Milliseconds 2600  # let a previous card fade out
                $r = $btn.Current.BoundingRectangle
                [Win]::Click([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2))
                Start-Sleep -Milliseconds 600
                Log "  click ${click}: card orange pixels=$(OrangePixels ($cx - 330) ($cy - 130) 660 260)  still minimised=$([Win]::IsIconic($tbw))"
                if ($click -eq 1) { Shot 'tbclick' }
              }
            } else { Log '  taskbar button: not found by UI Automation' }
          } catch { Log "  taskbar-button test error: $_" }

          $null = RunWait $exe '--quit'
          Start-Sleep -Seconds 2
          if (Get-Process WhichPC -ErrorAction SilentlyContinue) { throw '--quit did not stop WhichPC' }
          Log '--quit: process stopped'

          $null = RunWait "$env:LOCALAPPDATA\Programs\WhichPC\Uninstall.exe" '/S'
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw 'uninstall left WhichPC.exe behind' }
          if (Test-Path HKCU:\Software\WhichPC) { throw 'uninstall left settings behind' }
          Log 'Uninstall: files and settings removed'
          DumpAppLog
          Log 'Smoke test passed.'
          "## WhichPC Windows smoke test`n" + (($report | ForEach-Object { "    $_" }) -join "`n") | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: "*.png"
      - name: Screenshot previews and report (readable from the log alone)
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $jpeg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $params = New-Object System.Drawing.Imaging.EncoderParameters 1
          $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 55L
          Get-ChildItem crop-settings.png, crop-card.png -ErrorAction SilentlyContinue | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $scale = [Math]::Min(1.0, 560.0 / $img.Width)
            $bmp = New-Object System.Drawing.Bitmap $img, ([int]($img.Width * $scale)), ([int]($img.Height * $scale))
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, $jpeg, $params)
            "=== BEGIN $($_.BaseName) ($($ms.Length) bytes) ==="
            [Convert]::ToBase64String($ms.ToArray(), 'InsertLineBreaks')
            "=== END $($_.BaseName) ==="
            $img.Dispose(); $bmp.Dispose()
          }
          if (Test-Path report.txt) { '=== REPORT ==='; Get-Content report.txt }
