name: Build Android APK

# Local sandboxes used for development on this project cannot reach
# dl.google.com (Android SDK / Google Maven), so the APK is built here on
# GitHub-hosted runners, which have unrestricted internet access and a
# preinstalled Android SDK.

on:
  push:
    branches:
      - claude/html-to-android-apk-vhi395
    paths:
      - "SMART_check.html"
      - "native/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare web assets from the canonical single-file app
        run: |
          mkdir -p native/www
          cp SMART_check.html native/www/index.html

      - name: Install npm dependencies
        working-directory: native
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: native
        run: npx cap sync android

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-safety-platform-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Actions-run artifacts require a logged-in GitHub session and their
      # download links redirect through a host our dev sandbox's network
      # policy blocks, so also publish a Release asset for a plain,
      # directly-downloadable link.
      - name: Publish APK as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-run-${{ github.run_number }}
          name: "SMART 안전관리 플랫폼 debug APK (run #${{ github.run_number }})"
          body: |
            자동 빌드된 디버그 APK입니다. 정식 배포 서명이 아닌 Android debug 서명이
            적용되어 있으므로, 스마트폰에 설치할 때 "출처를 알 수 없는 앱 설치"를
            허용해야 합니다.
          files: native/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
